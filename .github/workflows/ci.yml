name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs-review-check:
    name: Documentation Review Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check changed markdown files' review footers
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            pull_request)
              BASE="${{ github.event.pull_request.base.sha }}"
              HEAD="${{ github.event.pull_request.head.sha }}"
              ;;
            push)
              BASE="${{ github.event.before }}"
              HEAD="${{ github.sha }}"
              ;;
            *)
              echo "Not a push/pull_request event -- skipping."
              exit 0
              ;;
          esac

          # A force-push or first-push-to-branch can make "before" a null SHA;
          # fall back to just the tip commit's own changes in that case.
          if [ "$BASE" = "0000000000000000000000000000000000000000" ] || [ -z "$BASE" ]; then
            CHANGED=$(git diff --name-only "${HEAD}~1" "$HEAD" -- '*.md' || true)
          else
            CHANGED=$(git diff --name-only "$BASE" "$HEAD" -- '*.md' || true)
          fi

          if [ -z "$CHANGED" ]; then
            echo "No markdown files changed -- skipping."
            exit 0
          fi

          echo "Changed markdown files:"
          echo "$CHANGED"
          echo
          python3 scripts/check_docs_review.py --changed-files $CHANGED

  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: Check Formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted properly:"
            echo "$unformatted"
            echo "Please run 'gofmt -w .' locally and commit the changes."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Check Vanilla JavaScript Syntax
        run: |
          for file in pkg/server/static/*.js; do
            if [ -f "$file" ]; then
              node -c "$file"
            fi
          done

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Check theme tokens resolve
        # A var(--x) that resolves to nothing makes the whole declaration invalid and the
        # browser drops it silently, so neither review nor the build notices. #1221 was five
        # of them, including a print rule that made the dark theme print a near-black page;
        # #1217 was a colour inherited by a theme it was never designed for.
        run: node scripts/check-theme-tokens.mjs

      - name: Check React UI Syntax & Types
        run: |
          cd ui
          pnpm install
          pnpm run lint
          pnpm run build

      # The "Build UI and check Sync" step that used to sit here is gone with #1196:
      # ui-dist is no longer committed, so there is nothing for it to be out of sync with.
      # "Check React UI Syntax & Types" above already runs pnpm run build, so a broken UI
      # build still fails this job.

      - name: Run Linter (golangci-lint)
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: Create dummy UI dist for Go embed
        run: mkdir -p pkg/server/ui-dist && touch pkg/server/ui-dist/index.html
        shell: bash

      - name: Run Tests
        run: make test
        shell: bash
        env:
          # Disposable minisign fixture used only by pkg/client/upgrade_test.go -- never
          # the real signing key (that one lives in 1Password and is never referenced by
          # anything in CI). Tests skip gracefully if this isn't set (e.g. local `make
          # test` runs without it exported).
          TEST_MINISIGN_SECRET_KEY: ${{ secrets.TEST_MINISIGN_SECRET_KEY }}

  e2e-test:
    name: E2E Docker Integration Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: Run E2E Integration Test
        run: ./tests/e2e/run.sh

  e2e-ui-test:
    name: E2E Playwright UI Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Run Playwright E2E Test
        run: make e2e-ui

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: |
            tests/e2e/ui/playwright-report/
            tests/e2e/ui/test-results/
          retention-days: 7
