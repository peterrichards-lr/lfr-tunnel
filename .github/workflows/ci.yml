name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Which downstream jobs need to run at all (#1343). Before this, a docs-only or
  # workflow-only PR ran the full 3-OS Go matrix, three E2E suites and Playwright.
  #
  # Uses plain `git diff` rather than a third-party filter action, matching what
  # docs-review-check below already does, and so there is no extra action to pin.
  #
  # FAIL OPEN. Every unresolved case sets true and runs everything. A wrong "false"
  # silently skips the tests that were supposed to gate the merge, which is far worse
  # than a wasted run.
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      ui: ${{ steps.filter.outputs.ui }}
      shell: ${{ steps.filter.outputs.shell }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine which areas changed
        id: filter
        run: |
          set -euo pipefail

          run_everything() {
            echo "$1"
            {
              echo "go=true"
              echo "ui=true"
              echo "shell=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          }

          case "${{ github.event_name }}" in
            pull_request)
              BASE="${{ github.event.pull_request.base.sha }}"
              HEAD="${{ github.event.pull_request.head.sha }}"
              ;;
            push)
              BASE="${{ github.event.before }}"
              HEAD="${{ github.sha }}"
              ;;
            *)
              run_everything "Not a push/pull_request event -- running everything."
              ;;
          esac

          # A force-push or first-push-to-branch makes "before" a null SHA.
          if [ "$BASE" = "0000000000000000000000000000000000000000" ] || [ -z "$BASE" ]; then
            CHANGED=$(git diff --name-only "${HEAD}~1" "$HEAD" 2>/dev/null) || \
              run_everything "Could not resolve the diff base -- running everything."
          else
            CHANGED=$(git diff --name-only "$BASE" "$HEAD" 2>/dev/null) || \
              run_everything "Could not diff $BASE..$HEAD -- running everything."
          fi

          if [ -z "$CHANGED" ]; then
            run_everything "Empty diff -- running everything."
          fi

          echo "Changed files:"
          echo "$CHANGED" | sed 's/^/  /'

          # Go: sources, module files, the Makefile that builds and tests them, the E2E
          # harnesses that exercise the binaries, and this workflow itself.
          if echo "$CHANGED" | grep -qE '\.go$|^go\.(mod|sum)$|^Makefile$|^tests/|^scripts/|^\.github/workflows/|^Dockerfile$|^cmd/'; then
            GO=true
          else
            GO=false
          fi

          if echo "$CHANGED" | grep -qE '^ui/|^\.github/workflows/'; then
            UI=true
          else
            UI=false
          fi

          if echo "$CHANGED" | grep -qE '\.sh$|^\.github/workflows/'; then
            SHELL_CHANGED=true
          else
            SHELL_CHANGED=false
          fi

          echo "go=$GO"    | tee -a "$GITHUB_OUTPUT"
          echo "ui=$UI"    | tee -a "$GITHUB_OUTPUT"
          echo "shell=$SHELL_CHANGED" | tee -a "$GITHUB_OUTPUT"

  docs-review-check:
    name: Documentation Review Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check changed markdown files' review footers
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            pull_request)
              BASE="${{ github.event.pull_request.base.sha }}"
              HEAD="${{ github.event.pull_request.head.sha }}"
              ;;
            push)
              BASE="${{ github.event.before }}"
              HEAD="${{ github.sha }}"
              ;;
            *)
              echo "Not a push/pull_request event -- skipping."
              exit 0
              ;;
          esac

          # A force-push or first-push-to-branch can make "before" a null SHA;
          # fall back to just the tip commit's own changes in that case.
          if [ "$BASE" = "0000000000000000000000000000000000000000" ] || [ -z "$BASE" ]; then
            CHANGED=$(git diff --name-only "${HEAD}~1" "$HEAD" -- '*.md' || true)
          else
            CHANGED=$(git diff --name-only "$BASE" "$HEAD" -- '*.md' || true)
          fi

          if [ -z "$CHANGED" ]; then
            echo "No markdown files changed -- skipping."
            exit 0
          fi

          echo "Changed markdown files:"
          echo "$CHANGED"
          echo
          python3 scripts/check_docs_review.py --changed-files $CHANGED

  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: Check Formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted properly:"
            echo "$unformatted"
            echo "Please run 'gofmt -w .' locally and commit the changes."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Check Vanilla JavaScript Syntax
        run: |
          for file in pkg/server/static/*.js; do
            if [ -f "$file" ]; then
              node -c "$file"
            fi
          done

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Check theme tokens resolve
        # A var(--x) that resolves to nothing makes the whole declaration invalid and the
        # browser drops it silently, so neither review nor the build notices. #1221 was five
        # of them, including a print rule that made the dark theme print a near-black page;
        # #1217 was a colour inherited by a theme it was never designed for.
        run: node scripts/check-theme-tokens.mjs

      - name: Check Formatting (Prettier)
        # Pinned, not `prettier@latest`. Prettier changes its output between releases, so
        # an unpinned check turns unrelated PRs red the day upstream ships a new version --
        # the same reasoning as the pinned gitleaks image in the pre-commit hook (#1343).
        # Scope is controlled by .prettierignore: Markdown, HTML and YAML are held back on
        # purpose, with the reasons written down there (#1403).
        run: npx --yes prettier@3.9.6 --check .

      - name: Check React UI Syntax & Types
        run: |
          cd ui
          pnpm install
          pnpm run lint
          pnpm run build

      # The "Build UI and check Sync" step that used to sit here is gone with #1196:
      # ui-dist is no longer committed, so there is nothing for it to be out of sync with.
      # "Check React UI Syntax & Types" above already runs pnpm run build, so a broken UI
      # build still fails this job.

      - name: Run Linter (golangci-lint)
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned rather than `latest` (#1343): a golangci-lint release should not be able
          # to fail an unchanged PR. Bump deliberately, like any other dependency.
          version: v2.13.1

  # Nothing checked dependencies for known advisories. golang.org/x/text carried a reachable
  # DoS (GO-2026-5970, #1342) for as long as it took someone to run govulncheck by hand.
  #
  # Dependabot does not cover this: its Go support does not propose version updates for
  # `// indirect` requirements the main module does not import directly, which is exactly what
  # x/text is. So this job is not redundant with dependabot.yml -- it covers what that cannot.

      - name: Required status checks must always produce a check run
        run: ./scripts/check-required-contexts.sh

  govulncheck:
    name: Vulnerability Scan
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: Create dummy UI dist for Go embed
        run: mkdir -p pkg/server/ui-dist && touch pkg/server/ui-dist/index.html

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  # 40+ shell scripts, none linted -- including the EDR-critical ones, where an unchecked exit
  # code is what let the pre-commit hook run zero tests while reporting success (#1334).
  #
  # Containerised to match how golangci-lint and gitleaks already run here, so there is no new
  # tool to install.
  #
  # -S error, not -S warning, and deliberately so. Measured on the tree at the time this landed:
  # -S error is clean, while -S warning reports 34 findings across 18 files (SC2088, SC2087,
  # SC2034, SC1007, SC2206, SC2046, SC2207). Enforcing a level the tree does not meet would mean
  # landing a red job and teaching people to ignore it. This sets a floor that holds today and
  # catches genuine errors; raising it to -S warning is tracked separately.
  shellcheck:
    name: Shell Lint
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Run shellcheck
        run: |
          mapfile -t FILES < <(git ls-files '*.sh')
          echo "Linting ${#FILES[@]} shell scripts..."
          docker run --rm -v "$(pwd)":/mnt -w /mnt koalaman/shellcheck:v0.11.0 \
            -S error -x "${FILES[@]}"

  # The secret scanner's own tests (#1377). gitleaks in the pre-commit hook was reporting
  # "No secrets detected" on a scan of zero bytes whenever the commit came from a git worktree,
  # so the hook proved it was configured rather than that it worked. This is the check that
  # proves it works, and it belongs in CI because the hook cannot test itself.
  #
  # Job-level `if:` is safe here: this job has no matrix, so a gated-off job still reports its
  # own context as `skipped`, which satisfies a required check. Only matrix jobs break that way
  # (#1380). This context is not required in any case.
  hook-tests:
    name: Hook Tests
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          # The suite creates linked worktrees off HEAD; give it real history to do that with.
          fetch-depth: 0

      - name: Run hook tests
        # No LFT_HOOK_TEST_ALLOW_SKIP here, deliberately. Docker is present on this runner, so
        # if the real end-to-end cases cannot run, that is a failure worth seeing rather than a
        # skip to wave through.
        run: make test-hooks

  # NOT gated at the job level, deliberately -- see #1380. Required checks on `master` are
  # configured in TWO places: the ruleset (5 contexts) and classic branch protection (9 contexts,
  # `enforce_admins` on). Both require the matrix-expanded contexts
  # `Test Suite (ubuntu-latest|macos-latest|windows-latest)`. A
  # job-level `if:` that evaluates false does not expand the matrix, so GitHub reports one
  # check named `Test Suite` (conclusion `skipped`) and those three contexts are never created
  # at all. A required context that never reports counts as pending, not as satisfied, so the
  # PR is blocked permanently with every check that ran showing green and nothing to re-run.
  # #1363 introduced that gate here and made every docs-only PR unmergeable; #1379 was the
  # first one to hit it.
  #
  # So the matrix always expands and every leg reports, and the *steps* carry the condition.
  # A non-Go PR costs three runner starts that do nothing, which is the price of the required
  # contexts naming specific OSes. #1365 tracks requiring an aggregator context instead, which
  # would let this go back to a job-level gate and let the matrix be trimmed on PRs.
  #
  # A job-level `if:` IS safe for a required context when the job has no matrix -- a skipped job
  # still reports its own context, and GitHub counts `skipped` as satisfied. That is why the
  # gates #1363 put on `e2e-test`, `e2e-edge-test` and `e2e-ui-test` are fine and are left alone.
  # Only the matrix job broke, plus e2e-sso.yml, which was gated at the workflow level instead.
  test:
    name: Test Suite
    needs: changes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Not a silent green: say which it was, so a skip is distinguishable from a pass in the
      # log rather than only by reading the workflow.
      - name: Report why this leg is a no-op
        if: needs.changes.outputs.go != 'true'
        run: echo "No Go, Makefile, script, workflow, Dockerfile or tests/ changes -- nothing to test."
        shell: bash

      - name: Checkout Code
        if: needs.changes.outputs.go == 'true'
        uses: actions/checkout@v7

      - name: Set up Go
        if: needs.changes.outputs.go == 'true'
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: Create dummy UI dist for Go embed
        if: needs.changes.outputs.go == 'true'
        run: mkdir -p pkg/server/ui-dist && touch pkg/server/ui-dist/index.html
        shell: bash

      - name: Run Tests
        if: needs.changes.outputs.go == 'true'
        run: make test
        shell: bash
        env:
          # Disposable minisign fixture used only by pkg/client/upgrade_test.go -- never
          # the real signing key (that one lives in 1Password and is never referenced by
          # anything in CI). Tests skip gracefully if this isn't set (e.g. local `make
          # test` runs without it exported).
          TEST_MINISIGN_SECRET_KEY: ${{ secrets.TEST_MINISIGN_SECRET_KEY }}

  # The race detector, which had never run in CI despite `make test` supporting it since #1122.
  # That one manual run immediately produced #1125 and #1131, both pre-existing and both shipped.
  #
  # SCOPED, deliberately. pkg/server still has 5 data races (#1370), all pre-existing and all
  # inside territory held elsewhere at the time this landed. Every other package is clean, so
  # this covers them now rather than waiting -- pkg/client is where #1122 and #1123 were found,
  # so the coverage is not hypothetical. Delete the exclusion once #1370 closes.
  #
  # A red job nobody can fix is worse than a narrow green one: it gets ignored, and then it gets
  # removed. This is a floor that holds today and ratchets, the same call made for shellcheck.
  #
  # ubuntu only: the detector needs cgo and roughly doubles wall time, and this class of bug is
  # not platform-specific. The plain `test` job keeps the 3-OS matrix.
  race:
    name: Race Detector
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: Create dummy UI dist for Go embed
        run: mkdir -p pkg/server/ui-dist && touch pkg/server/ui-dist/index.html

      - name: Run Tests (race detector)
        # Through make test, which exports GOTMPDIR and asserts it before building (#1335).
        # Never hand-roll `go test -race` here -- that is what the repo's deny rule exists for.
        run: |
          PKGS=$(go list ./... | grep -v /pkg/server | tr '\n' ' ')
          make test PKG="$PKGS" TEST_BUILD_FLAGS=-race
        env:
          TEST_MINISIGN_SECRET_KEY: ${{ secrets.TEST_MINISIGN_SECRET_KEY }}

  e2e-test:
    name: E2E Docker Integration Test
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: Run E2E Integration Test
        run: ./tests/e2e/run.sh

  # The multi-region harness existed but nothing ran it -- not CI, not the Makefile, not the
  # e2e dispatcher. It had been failing on a node-id mismatch that stopped the edge's control
  # channel authenticating at all, so its coverage of schedule pushes, shutdown warnings and
  # lease kicks never existed. Wired in so it cannot rot unnoticed again (#1254).
  e2e-edge-test:
    name: E2E Multi-Region Edge Test
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: Run Multi-Region Edge E2E Test
        run: ./tests/e2e/run-edge.sh

  e2e-ui-test:
    name: E2E Playwright UI Test
    needs: changes
    if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Run Playwright E2E Test
        run: make e2e-ui

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: |
            tests/e2e/ui/playwright-report/
            tests/e2e/ui/test-results/
          retention-days: 7

  # The single context branch protection requires, instead of naming each job (#1386).
  #
  # Why: the required-contexts list is configured in the GitHub UI and the jobs are defined
  # here, and nothing kept them in step. That drift produced two permanent merge blocks --
  # #1380 (a skipped matrix job reports one check run under the bare job name, so the
  # required per-OS contexts never appeared) and #1386 (a workflow-level `paths:` filter
  # meant no check run at all). With one context, adding or renaming a job here can never
  # desynchronise that list again.
  #
  # Note `needs:` is workflow-scoped, so this cannot cover
  # "E2E Keycloak SSO Integration Test" (e2e-sso.yml) or "Verify PR references an issue"
  # (issue-link-check.yml, which triggers on `labeled` and so cannot move here without
  # breaking the `no-issue-needed` override). Those two stay required in their own right.
  ci-gate:
    name: CI Gate
    # always(), never path-filtered: this is the context that gates the merge, so it has to
    # report on every PR. `if: success()` would be wrong -- it passes when upstream jobs
    # were skipped, including skipped *because a dependency failed*.
    if: always()
    needs:
      - changes
      - docs-review-check
      - lint-and-format
      - govulncheck
      - shellcheck
      - hook-tests
      - test
      - race
      - e2e-test
      - e2e-edge-test
      - e2e-ui-test
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have succeeded or been skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS"
          # `skipped` is allowed because path filters legitimately skip jobs. That is only
          # safe because EVERY job above is listed: a job skipped as a consequence of an
          # upstream failure cannot hide it, since the upstream job is in this list too and
          # reports `failure` itself. Drop a job from `needs:` and that guarantee goes with
          # it -- scripts/check-required-contexts.sh enforces that it never happens.
          bad=$(jq -r 'to_entries[]
                       | select(.value.result != "success" and .value.result != "skipped")
                       | "\(.key)=\(.value.result)"' <<<"$RESULTS")
          if [ -n "$bad" ]; then
            echo "::error::CI Gate failing -- these jobs did not pass:"
            echo "$bad"
            exit 1
          fi
          echo "All jobs succeeded or were skipped."
