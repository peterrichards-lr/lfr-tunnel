name: Deploy Documentation

on:
  push:
    branches: ["master"]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-dev.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch: # Allow manual trigger

# Only one Pages deployment should ever be in flight at a time -- unlike most of this
# repo's other workflows, don't cancel an in-progress deployment (a half-applied deploy
# would leave the live site broken). Same reasoning as the issue-link-check concurrency
# group (#1033).
concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Build site
        run: mkdocs build --site-dir _site --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
