name: Deploy Documentation

# PR builds and the rendered-output checks live in ci.yml's Documentation Build, which runs on
# every PR behind the docs paths filter and is required through CI Gate. This workflow only
# deploys; it does not repeat that build on PRs (#2391).
on:
  push:
    branches: ["master"]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "overrides/**"
      - "scripts/mkdocs_github_alerts.py"
      - "requirements-dev.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch: # Allow manual trigger

# Only one Pages deployment should ever be in flight at a time -- unlike most of this
# repo's other workflows, don't cancel an in-progress deployment (a half-applied deploy
# would leave the live site broken). This group is safe where issue-link-check's was not
# (#2358): GitHub still cancels a PENDING run when a newer one queues, and for a deploy only
# the newest one matters -- nothing here is a required status check waiting on every run.
concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history for git-revision-date-localized (#2391). Required: on a shallow clone the
          # plugin warns under GitHub Actions and --strict fails the deploy. CI's Documentation
          # Build fetches the same, so the two builds match.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Build site
        run: mkdocs build --site-dir _site --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
