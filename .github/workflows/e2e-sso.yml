name: SSO E2E Test

# Path-gated (#1343): this suite exercises the Go server against Keycloak, so a docs-only or
# UI-only change cannot affect it. Safe to skip the workflow outright here -- unlike the jobs in
# ci.yml, "E2E Keycloak SSO Integration Test" is not a required status check, so a run that never
# reports does not block a merge.
on:
  push:
    branches:
      - master
    # Duplicated rather than a YAML anchor: GitHub Actions' workflow parser does not
    # support anchors or aliases, so &/* would fail at run time despite parsing locally.
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'cmd/**'
      - 'pkg/**'
      - 'tests/e2e/**'
      - 'scripts/**'
      - 'Dockerfile'
      - '.github/workflows/e2e-sso.yml'
  pull_request:
    branches:
      - master
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'cmd/**'
      - 'pkg/**'
      - 'tests/e2e/**'
      - 'scripts/**'
      - 'Dockerfile'
      - '.github/workflows/e2e-sso.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-sso-test:
    name: E2E Keycloak SSO Integration Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: Run SSO E2E Integration Test
        run: ./tests/e2e/run-sso.sh
