name: SSO E2E Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-sso-test:
    name: E2E Keycloak SSO Integration Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: Run SSO E2E Integration Test
        run: ./tests/e2e/run-sso.sh

      - name: Sleep remote target node (mandatory cleanup)
        if: always()
        run: |
          TARGET_NODE="${{ inputs.node || vars.LDM_NODE_TARGET || env.LDM_NODE_TARGET || 'aws-1' }}"
          if [ "$TARGET_NODE" != "local" ] && [ -n "$TARGET_NODE" ]; then
            ./scripts/node_power.sh sleep "$TARGET_NODE" || true
          fi
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
