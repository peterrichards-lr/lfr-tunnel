name: Issue Link Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
    branches:
      - master

# Deliberately NO `concurrency:` group (#2358). This workflow fires on events that do not
# change the commit -- edited, labeled, unlabeled -- so several runs on one SHA are normal (a
# Dependabot PR is opened and labelled within a second), and a required context cannot sit
# behind a group that cancels any of them.
#
# The group used to be here with `cancel-in-progress: false`, on the reasoning (#1033) that
# runs would "complete naturally instead of being cancelled". That holds only for a run already
# IN PROGRESS. Under the default `queue: single`, a group holds one running and one pending run,
# and GitHub cancels the pending one whenever a newer run joins, whatever cancel-in-progress
# says. On #2354 a Dependabot rebase did exactly that: the previous SHA's run still held the
# group when two runs for the new SHA arrived together, and one was cancelled two seconds after
# creation, before any job started. Its check suite had no "Verify PR references an issue" run,
# the required context showed "Expected -- Waiting for status to be reported", and the PR sat
# BLOCKED for 16 hours with every check green. Nothing but `actions/runs?head_sha=` showed it,
# because a job-less run creates no check run. (The same cancellation happens on most Dependabot
# PRs; it only blocks when the job-less run is the newest on the head SHA.)
#
# Without a group, runs overlap. The job is read-only and reads the PR's labels, title and body
# live, and nothing cancels, so #1033's failure -- a cancelled check run beside a successful one
# -- cannot recur. What overlap does allow is two runs finishing out of order, in either
# direction: one that read the PR just before a label landed can fail after a newer one passed
# (a red check a re-run clears), or one that read it just before a label was removed can pass
# after a newer one failed (the policy reads green for a PR that no longer complies). Both need
# events seconds apart, and both are visible on the PR -- unlike the silent, indefinite block
# they replace. `queue: max` would keep the runs in order without cancelling, and was passed
# over on purpose: it puts this required context back on GitHub's queue semantics, which is
# what #1033 got wrong. scripts/check-required-contexts.sh (check 6) fails if a group returns.

permissions:
  contents: read
  pull-requests: read

jobs:
  check-issue-link:
    name: Verify PR references an issue
    runs-on: ubuntu-latest
    steps:
      # A reversed closing reference still closes the issue: GitHub matches the keyword and the
      # number and ignores the negation in front of them (#1540). Checked before the reference
      # requirement below so the specific message wins over the generic one.
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Reject a reversed closing reference
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh pr view "$PR_NUMBER" --repo "$REPO" --json title,body \
            -q '"\(.title)\n\(.body // "")"' > /tmp/pr-text.md
          ./scripts/check-closing-refs.sh /tmp/pr-text.md

      - name: Check for a closing issue reference or override label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          labels=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json labels -q '.labels[].name')
          if echo "$labels" | grep -qx "no-issue-needed"; then
            echo "OK: 'no-issue-needed' label present, skipping issue-link requirement."
            exit 0
          fi

          title=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json title -q '.title')
          body=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json body -q '.body // ""')

          if echo "$title"$'\n'"$body" | grep -qiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?)\b[[:space:]]*:?[[:space:]]*#[0-9]+'; then
            echo "OK: found a Closes/Fixes/Resolves #N reference."
            exit 0
          fi

          echo "::error::This PR doesn't reference a closing issue (e.g. 'Closes #123' in the title or body)."
          echo "Every PR should close a tracked GitHub issue, per .agents/skills/github-workflow/SKILL.md,"
          echo "so work items and tech debt stay tracked even when not addressed immediately."
          echo "If this change is genuinely too trivial to need one, add the 'no-issue-needed' label instead."
          exit 1
