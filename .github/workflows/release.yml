name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    # Which gateway, status page and portal the released binaries point at by default.
    # These describe one deployment rather than the software, so they are repository
    # variables rather than source (#1188). Leaving them unset is supported: the client
    # then asks to be pointed at a gateway instead of guessing one.
    env:
      DEPLOYMENT_LDFLAGS: >-
        -X lfr-tunnel/pkg/config.DefaultServerURL=${{ vars.LFT_DEFAULT_SERVER_URL }}
        -X lfr-tunnel/pkg/config.DefaultStatusPageURL=${{ vars.LFT_DEFAULT_STATUS_PAGE_URL }}
        -X lfr-tunnel/pkg/config.DefaultPortalURL=${{ vars.LFT_DEFAULT_PORTAL_URL }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Validate Tag Version Matches whats-new.json
        run: |
          if [ ! -f pkg/server/static/whats-new.json ]; then
            echo "❌ Error: pkg/server/static/whats-new.json not found!"
            exit 1
          fi
          JSON_VER=$(jq -r '.[0].version' pkg/server/static/whats-new.json)
          TAG_VER="${{ github.ref_name }}"
          JSON_VER_CLEAN="${JSON_VER#v}"
          TAG_VER_CLEAN="${TAG_VER#v}"
          if [ "$JSON_VER_CLEAN" != "$TAG_VER_CLEAN" ]; then
            echo "❌ Error: Pushed tag ($TAG_VER) does not match version in whats-new.json ($JSON_VER)!"
            exit 1
          fi
          echo "✅ Success: Tag ($TAG_VER) matches whats-new.json version ($JSON_VER)."

      # The React bundle is not committed (#1196), so it has to be built here before any
      # Go build: pkg/server embeds ui-dist, and a release compiled without this step
      # would ship a server with no portal. Mirrors the Dockerfile's ui-builder stage and
      # ci.yml. Runs before the tests too, so they exercise the real bundle.
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Build UI
        run: |
          cd ui
          CI=true pnpm install
          pnpm run build
          cd ..
          rm -rf pkg/server/ui-dist
          cp -r ui/dist pkg/server/ui-dist
          test -f pkg/server/ui-dist/index.html || { echo "::error::UI build produced no index.html"; exit 1; }

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: Run Tests
        run: make test

      - name: Prepare Dist Directory
        run: mkdir -p dist

      # Say which deployment defaults this release is being built with. Unset is a supported
      # mode -- the client then asks to be pointed at a gateway rather than guessing one --
      # but it is indistinguishable from the configured mode once the binaries are built, so
      # v1.48.0 shipped with no default gateway and nobody noticed until someone downloaded
      # it (#1256). A build that silently changes what the client does has to say so.
      - name: Report Deployment Defaults
        env:
          SERVER_URL: ${{ vars.LFT_DEFAULT_SERVER_URL }}
          STATUS_PAGE_URL: ${{ vars.LFT_DEFAULT_STATUS_PAGE_URL }}
          PORTAL_URL: ${{ vars.LFT_DEFAULT_PORTAL_URL }}
          TAG: ${{ github.ref_name }}
        run: |
          # Each default means something different when empty, so the consequence is
          # spelled out per line rather than shared.
          report() {
            if [ -z "$2" ]; then
              echo "  $1: (unset -- $3)"
            else
              echo "  $1: $2"
            fi
          }
          echo "Building $TAG with these deployment defaults:"
          report DefaultServerURL     "$SERVER_URL"      "clients will ask to be pointed at a gateway"
          report DefaultStatusPageURL "$STATUS_PAGE_URL" "no status-page hint when a gateway looks unreachable"
          report DefaultPortalURL     "$PORTAL_URL"      "browser login falls back to the gateway, which serves the portal too"
          if [ -z "$SERVER_URL" ]; then
            echo "::warning title=No default gateway::This release ships clients with no built-in gateway. Set the LFT_DEFAULT_SERVER_URL repository variable if that is not intended."
          fi

      - name: Build Server Gateway (lfr-tunneld)
        run: |
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w $DEPLOYMENT_LDFLAGS -X lfr-tunnel/pkg/config.Version=${{ github.ref_name }}" -trimpath -o dist/lfr-tunneld-linux-amd64 ./cmd/lfr-tunneld
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w $DEPLOYMENT_LDFLAGS -X lfr-tunnel/pkg/config.Version=${{ github.ref_name }}" -trimpath -o dist/lfr-tunneld-linux-arm64 ./cmd/lfr-tunneld

      - name: Build Client CLI (lfr-tunnel)
        run: |
          # Linux
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w $DEPLOYMENT_LDFLAGS -X lfr-tunnel/pkg/config.Version=${{ github.ref_name }}" -trimpath -o dist/lfr-tunnel-linux-amd64 ./cmd/lfr-tunnel
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w $DEPLOYMENT_LDFLAGS -X lfr-tunnel/pkg/config.Version=${{ github.ref_name }}" -trimpath -o dist/lfr-tunnel-linux-arm64 ./cmd/lfr-tunnel

          # macOS (Darwin)
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w $DEPLOYMENT_LDFLAGS -X lfr-tunnel/pkg/config.Version=${{ github.ref_name }}" -trimpath -o dist/lfr-tunnel-darwin-amd64 ./cmd/lfr-tunnel
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w $DEPLOYMENT_LDFLAGS -X lfr-tunnel/pkg/config.Version=${{ github.ref_name }}" -trimpath -o dist/lfr-tunnel-darwin-arm64 ./cmd/lfr-tunnel

          # Windows
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w $DEPLOYMENT_LDFLAGS -X lfr-tunnel/pkg/config.Version=${{ github.ref_name }}" -trimpath -o dist/lfr-tunnel-windows-amd64.exe ./cmd/lfr-tunnel

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Push Checksums to Checksums Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} cb-temp
          cd cb-temp
          git checkout checksums || git checkout --orphan checksums
          git rm -rf . || true
          cp ../dist/checksums.txt .
          git add checksums.txt
          git commit -m "update checksums for ${{ github.ref_name }}"
          git push -u origin checksums --force

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew Tap & Scoop Bucket
        env:
          TAP_BUCKET_PAT: ${{ secrets.TAP_BUCKET_PAT }}
        run: |
          chmod +x scripts/update-tap-bucket.sh
          ./scripts/update-tap-bucket.sh "${{ github.ref_name }}" "${TAP_BUCKET_PAT}" "dist/checksums.txt"

  publish-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Client Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/lfr-tunnel:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/lfr-tunnel:latest
