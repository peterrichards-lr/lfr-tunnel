  settings:
    gosec:
      # Rules excluded individually, each with a reason (#1331). A blanket exclusion is what
      # made this config dishonest in the first place, so none is used here.
      #
      # Measured on the tree when gosec was first enabled: 271 findings, of which these
      # account for ~200. Everything not listed is enforced.
      excludes:
        # Taint-analysis rules, added in recent gosec releases. They flag this design rather
        # than a defect: operator-supplied hook executables (dns_hook, power hook, vanity hook)
        # are *meant* to take their arguments from configuration and request data, and the
        # control-plane URL an edge calls is *meant* to come from config. Revisit if gosec gains
        # a way to mark a trusted source.
        - G702 # command injection via taint analysis -- operator-supplied hooks
        - G703 # path traversal via taint analysis -- operator-configured paths
        - G704 # SSRF via taint analysis -- the configured control-plane URL
        - G705 # XSS via taint analysis -- superseded by the escaping fixed in #1323
        - G706 # log injection via taint analysis -- 56 findings, all structured slog calls
        # File and subprocess rules that describe the deployment rather than a defect: paths
        # come from server-config.yaml, and the hooks above are executed on purpose.
        - G304 # file inclusion via variable -- certificate and config paths from config
        - G204 # subprocess launched with a variable -- the hook contract
        # Duplicates errcheck, which is enabled and stricter here (check-blank: true).
        - G104
        # By design, verified individually rather than assumed:
        - G402 # InsecureSkipVerify -- all 4 sites are gated on the documented
               # insecure_skip_verify config key; an operator opt-in, not a hardcoded bypass
        - G404 # math/rand -- used to shuffle domain order for load balancing, not for secrets
        - G505 # crypto/sha1 -- TOTP is HMAC-SHA1 by RFC 6238; the algorithm is mandated
        - G101 # "hardcoded credentials" -- constant *names* in pkg/config/metadata.go
        - G117 # tokens in marshalled structs -- these are the API's response bodies
        - G115 # integer conversions, almost all uint64<->int64 on byte counters in metrics
        - G118 # context.Background in a goroutine outliving its request, which is deliberate
        - G122 # filepath.Walk callback -- a client-side scan of the user's own directory
        - G124 # deferred close in a loop, in short-lived command helpers
        - G710 # unbounded read, on responses from the control plane this gateway configured
        # This block is empty on purpose. Every rule that was excluded "for now" has been
        # burned down: G112/G114 in #1372, and G301/G302/G306 in #1408. All are ENFORCED, so a
        # new permissive mode or a listener without a header timeout fails the build.
        #
        # Where a mode must stay permissive it carries a `//nolint:gosec` naming the actual
        # reason at the line -- nginx reading the maintenance page as www-data, a client binary
        # that has to be executable, a published checksum file. That is deliberately noisier
        # than a blanket exclusion here, because a suppression at the site can be checked
        # against the code beside it and an entry in this list cannot.
    errcheck:
      check-blank: true
      exclude-functions:
        - io.ReadAll
        - io/ioutil.ReadAll
        - os.Remove
        - os.RemoveAll
        - net.SplitHostPort
        - (*net/http.Response).Body.Close
        - (*net/http.Server).ListenAndServe
        - (*net/http.Server).Shutdown
        - crypto/rand.Read
        - fmt.Sscanf
        - (*bufio.Writer).Flush
        - fmt.Fprintf
        - (*encoding/json.Encoder).Encode
        - encoding/json.Marshal
        - encoding/json.MarshalIndent
        - (*os.File).Close
        - net.Conn.Close
        - (*net.TCPConn).Close
        - io.Copy
        - io.CopyBuffer
        - io.CopyN
        - (*net/http.Request).Context
        - strconv.Atoi
        - url.Parse
        - os.UserHomeDir
        - net/http.NewRequest
        - os.CreateTemp
        - os.Create
        - os.MkdirAll
        - os.Pipe
        - os.Setenv
        - (*os.Process).Kill
        - (*os/exec.Cmd).Start
        - (*database/sql.Rows).Close
        - lfr-tunnel/pkg/config.LoadClientConfig
        - (*encoding/json.Decoder).Decode
        - (*net/http.Server).Serve
        - (*net/http.Server).Close

    funlen:
      lines: 100
      statements: 50
    gocyclo:
      min-complexity: 20
    gocognit:
      min-complexity: 30
    dupl:
      threshold: 100
    goconst:
      min-len: 3
      min-occurrences: 3
