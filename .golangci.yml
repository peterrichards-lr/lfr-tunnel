version: "2"

linters:
  enable:
    - dupl
    - funlen
    - goconst
    - gocyclo
    - gocognit
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    # gosec is the one linter most worth having on an internet-facing gateway that terminates
    # TLS, proxies untrusted traffic, issues certificates and stores credentials (#1331). Its
    # noisier rules are excluded below, individually and with reasons, rather than by leaving
    # the linter off.
    - gosec

  exclusions:
    rules:
      # Exclude all test files from complexity, length, duplication, and constant checks
      - path: _test\.go
        linters:
          - funlen
          - gocyclo
          - gocognit
          - dupl
          - goconst
          # gosec too: a test's hardcoded credential, permissive temp-dir mode or missing
          # server timeout is fixture setup, not deployed surface (#1331).
          - gosec
      # Exclude main.go from gocognit, gocyclo, and funlen due to orchestrating CLI setup
      - path: cmd/lfr-tunnel/main\.go
        linters:
          - gocognit
          - gocyclo
          - funlen
      # Files that breach the complexity limits today, listed individually rather than by
      # package (#1331).
      #
      # This used to exclude pkg/client, pkg/config, pkg/server, pkg/db, pkg/mail, pkg/mcp and
      # pkg/ops wholesale -- 7 of the 13 packages under pkg/, and by line count most of the
      # non-test Go in the repo -- so funlen, gocyclo, gocognit, dupl and goconst were enabled
      # but did not run. The "legacy" framing had not aged well: those are the active packages,
      # and the code inside them kept growing under the exemption. server.go was 5,359 lines
      # when #319 ("Refactor server.go God Object") was closed as completed; it is ~6,400 today.
      #
      # Listing files means a NEW file in any of these packages is linted from birth, which is
      # the property that was missing -- nothing stopped the next 6,000-line file. Each entry
      # here is a debt to remove, not settled configuration; see #319 for pkg/server.
      - path: pkg/client/client\.go
        linters:
          - funlen
          - gocyclo
          - gocognit
          - dupl
          - goconst
