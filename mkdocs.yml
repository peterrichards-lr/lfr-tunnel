site_name: Liferay Tunnel
site_url: https://peterrichards-lr.github.io/lfr-tunnel/
site_description: "An open-source tunneling utility tailored for Liferay Development and Sales Engineering teams -- securely expose local Liferay runtime environments through dynamic wildcard subdomains."
site_author: Liferay Tunnel Contributors
repo_url: https://github.com/peterrichards-lr/lfr-tunnel
repo_name: peterrichards-lr/lfr-tunnel

theme:
  name: material
  favicon: assets/favicon.png
  logo: assets/logo.svg

plugins:
  - search

# Without these, the published site silently loses two things the source clearly intends.
# Measured on the built output before they were added: 33 GitHub alert markers printed to the
# reader as literal "[!WARNING]" text inside an ordinary blockquote, and 8 mermaid diagrams
# rendered as code blocks. Reading this file would only have told you the extensions were
# absent -- it took grepping site/ to see what that cost (#2081).
markdown_extensions:
  - admonition          # the target syntax the hook below converts GitHub alerts into
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        # Hands ```mermaid blocks to Material's bundled mermaid.js instead of the code
        # highlighter. Without it every architecture diagram is a wall of text.
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# GitHub alerts are native on github.com and unknown to Python-Markdown. The source stays
# GitHub-native -- that is where contributors read these files -- and the build translates.
hooks:
  - scripts/mkdocs_github_alerts.py

# The navigation below is hand-maintained -- `plugins:` is only `search`, so nothing derives it
# from the docs/ tree. A page added under docs/ and left out of nav: still builds and deploys; it
# is simply unreachable except by direct URL or site search, and `mkdocs --strict` reports that as
# INFO rather than a warning, so the build stays green either way (#1918).
#
# `make check-docs-nav` (scripts/check-mkdocs-nav.cjs, also run by CI's Documentation Build) fails
# on any docs/**/*.md that is in neither nav: below nor the nav-exclude list here -- so a page
# deliberately kept off the site can be told apart from one that was forgotten.
#
# Pages deliberately not on the site. One per line, reason required:
#
#   # nav-exclude: <path relative to docs/> -- <why it is not on the site>
#
# nav-exclude: docker_hub_readme.md -- the Docker Hub repository description, pasted by hand into hub.docker.com. It is written for that listing (Docker Hub pull badge, absolute raw.githubusercontent.com image URLs) and restates the Home page, so publishing it here too would put a second, drifting front page on the site.
nav:
  - Home: README.md
  - Client Guides:
    - Getting Started: getting_started.md
    - Client Configuration File: client_configuration.md
    - Liferay SE Guide: liferay-se-guide.md
    - MCP Guide: mcp.md
    - Exposing Any Local HTTP Service: exposing-any-http-service.md
  - Server & Operator Guides:
    - Control Plane Setup: server/setup_guide.md
    - Edge Node Scaling: server/edge_setup_guide.md
    - AWS Provisioning: server/aws_setup_guide.md
    - SSO / OIDC Cloud Guide: server/sso_cloud_guide.md
  - Architecture & Security:
    - System Architecture: architecture.md
    - InfoSec & Trust Guide: infosec.md
  - Project Info:
    - Contributing: https://github.com/peterrichards-lr/lfr-tunnel/blob/master/CONTRIBUTING.md
    - Security Policy: https://github.com/peterrichards-lr/lfr-tunnel/blob/master/SECURITY.md
    - Code of Conduct: https://github.com/peterrichards-lr/lfr-tunnel/blob/master/CODE_OF_CONDUCT.md
