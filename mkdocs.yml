site_name: Liferay Tunnel
site_url: https://peterrichards-lr.github.io/lfr-tunnel/
# <= ~155 characters, leading with "Liferay" and the terms people search for (#2391).
site_description: "Liferay tunnel for DXP and Portal: securely expose a local Liferay environment on a public HTTPS subdomain for demos, testing and remote access."
site_author: Liferay Tunnel Contributors
repo_url: https://github.com/peterrichards-lr/lfr-tunnel
repo_name: peterrichards-lr/lfr-tunnel
edit_uri: edit/master/docs/

# ---- Shared across the Liferay tools docs sites (LDM, AICA, lfr-tunnel; #2391) ----------------
# Merged from the kit's mkdocs.baseline.yml. Keep in step with the other two sites; the project
# block above and nav: below are the only parts meant to differ.
copyright: >-
  A community project &mdash; not an official Liferay product

theme:
  name: material
  custom_dir: overrides            # main.html + partials/copyright.html
  language: en
  logo: assets/logo.svg            # light variant (white hex): sits on the header -- blue in light mode, navy in dark
  favicon: assets/favicon.png      # 64px PNG of the blue variant; favicon.svg via extra below
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: Roboto Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.sections
    - navigation.indexes
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow

extra_css:
  - assets/stylesheets/liferay-blue.css   # byte-identical across the three sites

plugins:
  - search
  - git-revision-date-localized:      # needs fetch-depth: 0 wherever the site is built
      type: date
      enable_creation_date: false
      fallback_to_build_date: true

# Search-engine ownership tokens, rendered into every page's <head> by overrides/main.html.
# Add Bing's as `bing_site_verification:` (emitted as msvalidate.01) the same way.
extra:
  google_site_verification: r7MfW8Y9zUhxsygop-Ubkr6dt7i9rUmddL4pEI26Ngk
  social_image: assets/social-preview.png      # 1280x640, Open Graph/Twitter, via overrides/main.html
  favicon_svg: assets/favicon.svg
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/peterrichards-lr
      name: More Liferay tools by Peter Richards
  # Read by scripts/check_docs_rendered.py, the template's rendered-output check (#2407), from
  # the Liferay profile in ai-agent-template v2.2.0. See its docs-site-standard skill.
  docs_standard:
    project_name: Liferay Tunnel
    # Names a sentence-case nav label may capitalise mid-label. Acronyms (SSO, AWS) and
    # inner-capital names (InfoSec) pass by their shape.
    proper_nouns: [Liferay]
    home_layout: true
    notice:
      title: Community project
      text: Not an official Liferay product and not covered by Liferay Support
      link_text: About this project
    related:
      heading: Related Liferay tools
      intro: >-
        Three community tools from the same maintainer. None is an official
        Liferay product or covered by Liferay Support.
      rows:
        - name: Liferay Docker Manager
          url: https://peterrichards-lr.github.io/liferay-docker-manager/
          description: Run, manage and develop Liferay DXP and Portal environments in Docker.
        - name: Liferay AI Commerce Accelerator
          url: https://peterrichards-lr.github.io/liferay-ai-commerce-accelerator/
          description: Generate and manage AI-driven commerce data in Liferay DXP.
        - name: Liferay Tunnel
          url: https://peterrichards-lr.github.io/lfr-tunnel/
          description: Securely expose a local Liferay environment on a public HTTPS subdomain.

# Without these, the published site silently loses two things the source clearly intends.
# Measured on the built output before they were added: 33 GitHub alert markers printed to the
# reader as literal "[!WARNING]" text inside an ordinary blockquote, and 8 mermaid diagrams
# rendered as code blocks. Reading this file would only have told you the extensions were
# absent -- it took grepping site/ to see what that cost (#2081).
markdown_extensions:
  - admonition          # the target syntax the hook below converts GitHub alerts into
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: ['.']
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        # Hands ```mermaid blocks to Material's bundled mermaid.js instead of the code
        # highlighter. Without it every architecture diagram is a wall of text.
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# GitHub alerts are native on github.com and unknown to Python-Markdown. The source stays
# GitHub-native -- that is where contributors read these files -- and the build translates.
hooks:
  - scripts/mkdocs_github_alerts.py

# The navigation below is hand-maintained -- no plugin in `plugins:` derives it from the docs/ tree
# (search and git-revision-date-localized only; no awesome-pages or literate-nav). A page added under docs/ and left out of nav: still builds and deploys; it
# is simply unreachable except by direct URL or site search, and `mkdocs --strict` reports that as
# INFO rather than a warning, so the build stays green either way (#1918).
#
# `make check-docs-nav` (scripts/check-mkdocs-nav.cjs, also run by CI's Documentation Build) fails
# on any docs/**/*.md that is in neither nav: below nor the nav-exclude list here -- so a page
# deliberately kept off the site can be told apart from one that was forgotten.
#
# Pages deliberately not on the site. One per line, reason required:
#
#   # nav-exclude: <path relative to docs/> -- <why it is not on the site>
#
# nav-exclude: docker_hub_readme.md -- the Docker Hub repository description, pasted by hand into hub.docker.com. It is written for that listing (Docker Hub pull badge, absolute raw.githubusercontent.com image URLs) and restates the Home page, so publishing it here too would put a second, drifting front page on the site.
nav:
  - Home: README.md
  # The shared top-level order (ai-agent-template#135, docs-site-standard; #2405): Home, Tutorials,
  # How-to guides, Reference, Explanation, Troubleshooting, Showcase, Project and contributing,
  # About these docs -- in that order, in sentence case, a section with no pages omitted, never
  # renamed or reordered. check_docs_rendered.py holds the built site to it. Moving a page between
  # sections is a nav edit only: the file stays put, so its published URL does not change.
  - Tutorials:
    - Getting started: getting_started.md
  - How-to guides:
    - Client:
      - Liferay SE guide: liferay-se-guide.md
      - MCP guide: mcp.md
      - Exposing any local HTTP service: exposing-any-http-service.md
      - Using your own domain: custom_domains.md
    - Server and operator:
      - Control plane setup: server/setup_guide.md
      - Edge node scaling: server/edge_setup_guide.md
      - AWS provisioning: server/aws_setup_guide.md
      - SSO / OIDC cloud guide: server/sso_cloud_guide.md
  - Reference:
    - Client configuration file: client_configuration.md
  - Explanation:
    - System architecture: architecture.md
    - InfoSec and trust guide: infosec.md
  - Project and contributing:
    - Contributing: https://github.com/peterrichards-lr/lfr-tunnel/blob/master/CONTRIBUTING.md
    - Security policy: https://github.com/peterrichards-lr/lfr-tunnel/blob/master/SECURITY.md
    - Code of conduct: https://github.com/peterrichards-lr/lfr-tunnel/blob/master/CODE_OF_CONDUCT.md
  - About these docs: about.md
