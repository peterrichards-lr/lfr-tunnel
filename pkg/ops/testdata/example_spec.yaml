domains:
  - zone: example.com
    records:
      - name: "@"
        type: A
        value: "${IPV4}"
        ttl: 120
      - name: "@"
        type: AAAA
        value: "${IPV6}"
        ttl: 120
      - name: "*"
        type: A
        value: "${IPV4}"
        ttl: 120
      - name: tunnel
        type: A
        value: "${IPV4}"
        ttl: 120
        cloudflare:
          proxied: false
      - name: "@"
        type: TXT
        value: "v=spf1 ip4:${IPV4} ip6:${IPV6} -all"
        ttl: 120
      - name: _dmarc
        type: TXT
        value: "v=DMARC1; p=reject; sp=reject; adkim=s; aspf=s;"
        ttl: 120
  - zone: example.org
    records:
      - name: "@"
        type: A
        value: "${IPV4}"
        ttl: 300
