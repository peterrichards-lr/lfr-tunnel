session_keys_confirm_body=Isto abrange toda a frota. Cada nó ligado tem de confirmar que detém a nova geração antes de algo mudar; se algum não o fizer, nada muda e a tentativa fica registada como cancelada. Em qualquer dos casos, nenhum visitante é desligado.
