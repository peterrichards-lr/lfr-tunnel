geo_attribution_maxmind=This product includes GeoLite Data created by MaxMind, available from {0}.
geo_attribution_dbip={0}, utilizado sob a licença Creative Commons Atribuição 4.0 Internacional.
geo_attribution_ip2location=Liferay Tunnel uses the IP2Location LITE database for {0}.
geo_attribution_ipinfo=Os dados de endereços IP são fornecidos por {0}.
geo_attribution_unknown=Não foi possível identificar o fornecedor desta base de dados geo-IP a partir dos metadados do ficheiro, pelo que a gateway não consegue apresentar a menção exigida. Verifique a licença do ficheiro que implementou e adicione a atribuição manualmente: a maioria dos fornecedores de geo-IP exige uma menção visível onde quer que os seus dados apareçam.

# Choosing the geo-IP vendor from System Settings (#1995).
#
# The three VENDOR LABELS below are brand names and are deliberately identical in every bundle,
# for the same reason the acknowledgments above are: translating a company's name names a
# different company. Everything else here is this gateway's own operator-facing prose and IS
# translated -- it is read by somebody who has to act on it.
geo_provider_title=Fornecedor de geo-IP
geo_provider_desc=A licença de cada fornecedor suportado exige uma menção visível diferente, e não se pode confiar num ficheiro de base de dados geo-IP para dizer quem o publicou, pelo que o fornecedor tem de ser indicado. Escolher um aqui produz efeito de imediato, sem reiniciar.
geo_provider_label=Fornecedor da base de dados
geo_provider_none=(não definido) -- a distribuição geográfica permanece desligada
geo_provider_maxmind=MaxMind (GeoLite2 / GeoIP2)
geo_provider_dbip=DB-IP
geo_provider_ip2location=IP2Location
geo_provider_ipinfo=IPinfo (Lite)
geo_provider_source_portal=Em vigor: o fornecedor escolhido aqui, que prevalece sobre country_db_provider em server-config.yaml.
geo_provider_source_config=Em vigor: country_db_provider em server-config.yaml, definido como {0}. Escolher um fornecedor aqui prevalece sobre esse valor.
geo_provider_source_unset=Não há nenhum fornecedor definido aqui nem em server-config.yaml, pelo que a distribuição geográfica está desligada e não é publicada qualquer menção.
geo_provider_credit_label=Esta menção será publicada onde quer que a distribuição geográfica seja apresentada:
geo_provider_path_label=Ficheiro da base de dados
