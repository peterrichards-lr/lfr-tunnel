# Anonymous geographic distribution (#1152)
geo_distribution=Distribuição Geográfica
country=País
geo_other=Outros
geo_period=Utilizadores distintos por país na semana
geo_unavailable=Não há nenhuma base de dados geo-IP configurada, por isso a distribuição geográfica está desativada. Defina country_db_path para uma base de dados de países no formato .mmdb (MaxMind GeoLite2, DB-IP Lite ou IP2Location LITE servem) para a ativar.
geo_path_not_found=Não existe nenhum ficheiro no caminho da base de dados geo-IP configurado em country_db_path, por isso a distribuição geográfica está desativada. Verifique se há uma gralha: {0}
geo_unreadable=Não foi possível ler a base de dados geo-IP configurada em country_db_path, por isso a distribuição geográfica está desativada. Tem de ser um ficheiro .mmdb no formato MaxMind que a gateway consiga abrir: {0}
geo_provider_not_declared=Uma base de dados geo-IP está configurada, mas country_db_provider não indica quem a publicou, pelo que a distribuição geográfica está desativada. Cada fornecedor suportado exige um crédito visível diferente e não se pode confiar que o ficheiro se identifique: defina country_db_provider como maxmind, dbip, ip2location, ipinfo.
geo_provider_unknown=country_db_provider indica um fornecedor que este gateway não reconhece, pelo que a distribuição geográfica está desativada. Tem de ser maxmind, dbip, ip2location, ipinfo.
geo_below_threshold=Ainda nenhum país tem utilizadores distintos suficientes para ser mostrado sem os identificar.
geo_threshold_note=Países com menos de {0} utilizadores são agrupados em Outros, para que ninguém possa ser identificado por ser a única pessoa num local.

# See Language.properties: the three vendor lines below are licence-prescribed
# acknowledgments and are intentionally identical in every bundle. geo_attribution_unknown is
