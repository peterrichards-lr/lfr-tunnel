# Portal strings that had no key at all (#2248, phase 2 of #2247).
#
# Phase 1 (#2253) pointed every element whose text already WAS a bundle value at that key.
# What is left are the strings no bundle carried: 17 V1 placeholders, the eleven native
# tooltips on the dashboard (reachable at all only since applyTranslations grew
# data-i18n-title), the six quota/limit admin modals, the domain-allocation rules, and the
# V2 labels that were still English literals.
#
# A value that is a bare example -- an address, a six-digit code, a filesystem path -- is
# DELIBERATELY identical in every bundle, the same convention ban_ip_placeholder and
# custom_domain_placeholder already follow: translating 192.168.1.1 names a different host.
# Everything else is this gateway's own prose and is translated in full, including the
# second sentence of a two-sentence tooltip.
