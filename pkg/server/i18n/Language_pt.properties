# Diagnostic log sharing (#1696) -- opt-in, and separate from the policy consent above.
diagnostics_consent_label=Permitir que os administradores recolham os registos de diagnóstico do meu cliente
diagnostics_consent_desc=Opcional e desativado salvo se o ativar. O seu cliente escreve registos em ~/.lfr-tunnel/logs e regista, para cada pedido que encaminha, a hora, o método HTTP, o caminho do URL (sem a cadeia de consulta), o estado da resposta, a duração, a porta local para onde foi enviado e a região de extremidade por onde chegou, além de eventos de ligação e de erro que podem incluir nomes de anfitrião e endereços IP locais, e a própria saída de consola do cliente. Os corpos dos pedidos e das respostas só são registados se iniciar o cliente com -log-bodies. Pode alterar isto a qualquer momento.
diagnostics_consent_error=Não foi possível guardar a sua preferência de diagnóstico. Tente novamente.

