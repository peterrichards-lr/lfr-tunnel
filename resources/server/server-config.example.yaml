# Central control-plane configuration -- COMPLETE key reference.
# UNKNOWN KEYS ARE REJECTED. A key this gateway does not understand stops it starting, with the
# offending key named -- a mistyped key that is silently skipped is indistinguishable from one
# that took effect, which is how a feature stays off with nothing to explain why.
#
# Rolling a gateway BACK to an older build whose config contains a newer key is the one case
# where that bites. Set LFT_ALLOW_UNKNOWN_CONFIG_KEYS=true to start anyway -- deliberately, and
# visible in the log.
#
# The CLIENT config is deliberately lenient and stays that way: people carry retired keys in
# ~/.lfr-tunnel/config.yaml from old examples, and a client that refuses to start cannot be
# fixed remotely.
#
# Every top-level key `pkg/config.ServerConfig` accepts appears here exactly once, with a
# placeholder value. A test asserts that (`TestExampleConfigCoversEveryField`), so adding a
# setting to the struct without adding it here fails the build -- which is the point. This file
# existing and being incomplete would be worse than not existing, because it would look
# authoritative (#1452).
#
# What this is NOT: a description of any live deployment. Values are placeholders, and the real
# ones are not recorded in this repo. Anything a credential could hide in -- token hashes, SMTP
# credentials, webhook URLs -- is left empty here and supplied out of band.
#
# Per-setting guidance lives in docs/server/setup_guide.md. Deliberately not restated here: one
# rule, one home. This file answers "what keys exist"; that document answers "what should I set
# them to".
#
# Two commands check a real deployment against this repo:
#   lfr-tunneld -check-config -config <file>      does it parse, and would it start
#   lfr-tunnel-ops check-config -target central   does it match the committed DNS spec, and are
#                                                 ownership and mode right


# --- Identity and listeners ---
domains:
  - "example.com"
  - "example.net"
tunnel_domains: []
default_domain: ""
domain_allocation_rule: ""
bind_addr: ":443"
http_bind_addr: "127.0.0.1:8080"
chisel_bind_addr: ":8081"
db_path: "/etc/lfr-tunneld/lfr-tunnel.db"

# --- TLS ---
ssl_cert_file: ""
ssl_key_file: ""
client_ca_file: ""
client_ca_key_file: ""
insecure_skip_verify: false

# --- Who may connect, and how strictly ---
force_client_cert: false
force_passcode: false
force_ip_whitelist: false
force_mfa: false
allowed_email_domains:
  - "example.com"
disable_email_login: false
disable_new_registrations: false
enforce_policy_consent: false
# Bump policy_version whenever the privacy/cookie policy text changes: every user who has
# not accepted this exact string is asked again, with policy_consent_grace_days to do it
# before their client stops working. Empty means never re-ask (the historical behaviour).
policy_version: ""
policy_consent_grace_days: 14
policy_consent_warning_days: 5
# Refusing NEW tunnels at expiry already enforces the policy; turning this on also drops
# tunnels that are already running, mid-session.
policy_consent_stops_active_tunnels: false

# --- Quotas. A null means "inherit the default", which is not the same as zero ---
default_max_reservations: 0
admin_max_reservations: null
owner_max_reservations: null
default_max_custom_domains: 0
admin_max_custom_domains: null
owner_max_custom_domains: null
default_max_active_tunnels: 0
admin_max_active_tunnels: null
owner_max_active_tunnels: null
# --- Cumulative bandwidth quota (#1959) ---
# Enforced on the TOTAL of inbound and outbound traffic per period -- the fairness measure,
# and the one a user cannot dodge by pulling heavily inbound. Egress is reported separately
# (admin users screen, alert bodies) because that is the figure the AWS invoice charges for.
# Three levels, most specific wins: the per-user override (admin users screen) beats
# role_settings.<role>.bandwidth_quota_bytes, which beats default_bytes here.
# The period is the calendar month in UTC unless period_days is set.
bandwidth_quota:
  # 0 disables the quota fleet-wide. 53687091200 is 50 GiB.
  default_bytes: 53687091200
  # Percentage of the allowance at which tunnels are throttled but stay up.
  throttle_percent: 80
  # Requests per second a throttled tunnel is held to.
  throttle_rate_limit: 1
  # 0 means the calendar month. Set only to use a fixed-length period instead.
  period_days: 0
allow_client_auto_reservation: false
subdomain_quarantine_days: 0
max_tunnel_rate_limit: 0
disable_api_rate_limit: false
pat_retention_days: 0

# --- Owner and notifications ---
owner:
  user_id: "admin@example.com"
  name: "Gateway Admin"
admin_notification_email: "admin@example.com"
smtp_server:
  host: "email-smtp.example.com"
  port: 587
  username: ""      # supply out of band; never commit
  password: ""      # supply out of band; never commit
  from_address: "Liferay Tunnel <noreply@example.com>"
webhooks:
  enabled: false
  slack_url: ""     # secret; never commit
  teams_url: ""     # secret; never commit
  batch_interval_seconds: 0
slack_app: {}

# --- Portal ---
enable_user_portal: false
portal_url: "https://example.com"
portal_session_duration: "1h"
# The absolute life of a session, however active it is. portal_session_duration above is an idle
# timeout that slides on use, so without this a continuously-used session renews indefinitely --
# and the sliding is suppressed by a client-supplied header, so that bound depends on the client
# behaving. This one is measured from login and nothing the client sends can move it.
# Empty or unset disables it, which is the behaviour before it existed.
portal_session_max_lifetime: "24h"
enable_onboarding: false
view_config_allowed_role: ""
role_settings:
  admin:
    allow_auto_reservation: false
    # Per-role bandwidth allowance in bytes; null (or absent) inherits bandwidth_quota.default_bytes.
    bandwidth_quota_bytes: null
  owner:
    allow_auto_reservation: true
    bandwidth_quota_bytes: null
sso_providers: []

# --- Edge tier. urls are DERIVED from the DNS spec -- see `lfr-tunnel-ops render-edge-nodes` (#1468) ---
central_url: "https://example.com"
control_plane_url: "https://example.com"
edge_token: ""
edge_nodes:
  # Render with `lfr-tunnel-ops render-edge-nodes` rather than writing by hand: the url is
  # derived from the committed DNS spec, and a hand-typed one is how three of four edges came
  # to name hosts that resolved to the control plane itself (#1449).
  # - id: "edge-us"
  #   token_hash: "<sha256 of the edge token; never commit a real one>"
  #   url: "https://us.example.com"
  #   # Accepted alongside token_hash, so a token can be rotated without a flag day (#1491):
  #   # add the incoming hash, roll the edges one at a time, then remove the old one. Both
  #   # authenticate while the rotation is in progress, on the REST endpoints and the control
  #   # channel alike.
  #   additional_token_hashes:
  #     - "<incoming hash, during a rotation>"
  []
edge_provisioner_url: "https://example.com"
edge_provisioner_token_file: ""
edge_shutdown_warning_minutes: 0
# How often an EDGE reports the bytes its leases have carried, up the edge control channel to
# the control plane (#1958). An edge has no database, so this is the only route its traffic has
# into tunnel_metrics -- and the only bandwidth an edge-served session ever contributes.
# 0 means the 30s default, which is also the most an ungraceful stop can lose: a graceful
# stop, a drain and a scheduled-shutdown warning all flush first. Set it on an edge; it is
# ignored on the control plane.
edge_metrics_interval_seconds: 0

# --- Hooks ---
dns_hook: ""
dns_withdraw_grace: "1h"
vanity_domain_hook: ""
maintenance_trigger_path: ""

# --- Client distribution ---
min_client_version: "v1.0.0"
# How long a client below min_client_version keeps being accepted after this gateway first
# sees it below the floor, and how long before that deadline the client starts warning in its
# own output. Both measured from that client's OWN first sight, so somebody on leave gets the
# whole window. 0 uses the defaults (14 and 5); the warning is clamped to the grace window.
#
# Set the grace window PER ROLLOUT. The first bump wants a generous one -- the fleet still
# contains clients too old to carry the warning code at all -- while a later one tightening an
# already-current fleet does not.
min_client_version_grace_days: 14
min_client_version_warning_days: 5
latest_client_version: ""
# How often the gateway pings each attached tunnel client over the chisel control channel.
# Empty/0 uses the built-in 25s. Pairs with nginx's proxy_read_timeout on `location /tunnel`
# (60s by default), so change both together (#1946).
tunnel_keepalive: "25s"
# How long a client keeps trying to reattach to this gateway before handing control back to
# its own region failover. Advertised on /api/version; empty/0 means the client uses its own
# default (60s). Clients clamp this to 20s-180s (#1946).
client_reconnect_window: "60s"
# How often attached clients post /api/tunnel-status. Empty/0 means the client uses its own
# default (5s). Clients clamp this to 2s-60s.
#
# This one is advertised because its cost lands on the GATEWAY, not on the client: a large
# fleet reporting too often is load only this side can see. Both this and the reconnect window
# travel in the client_settings block on /api/version (#1948), which is where later tuning
# values go too -- a client too old to read the block simply keeps its own defaults.
client_heartbeat_interval: "5s"
client_platforms: {}
docker_image: ""
docker_bypass_url: "https://example.com"
disable_client_downloads: false
disable_brew: false
disable_scoop: false

# --- Links shown in the portal and CLI ---
documentation_url: "https://example.com"
repository_url: "https://example.com"
secure_token_guide_url: "https://example.com"
docker_hub_url: "https://example.com"
status_page_url: "https://example.com"
privacy_policy_url: "https://example.com"
cookie_policy_url: "https://example.com"

# --- Timers and housekeeping ---
prune_interval: "1h"

# Where scripts/common/gateway-watchdog.sh records the services it restarted, so the gateway can
# forward them to the admin address once it is back up (#1875). Leave empty unless the watchdog
# was installed with LFT_WATCHDOG_SPOOL pointing somewhere other than its default
# (/var/lib/lfr-tunnel/watchdog-events.jsonl) -- the two have to agree or the gateway reads a file
# nothing writes and reports no restarts at all.
watchdog_spool_path: ""
magic_link_expiry: "1h"
invite_link_expiry: "1h"
verification_link_expiry: "1h"
visitor_timeout: "1h"
disable_backup_scheduler: false

# --- Abuse controls ---
enable_waf: false
auto_ban: {}
ip_blacklist: []
trusted_proxies: []
proxy_headers: {}

# --- Anonymous geographic distribution (#1152) ---
# Absolute path to a geo-IP database in MaxMind's .mmdb format. A client IP is resolved to a
# country in memory at registration and then discarded; only per-country counts of distinct
# users are stored, and countries below the k-threshold are folded into an "OTHER" bucket.
#
# Three vendors' free COUNTRY editions work (#1921): MaxMind GeoLite2 Country, DB-IP IP to
# Country Lite, and IP2Location LITE DB1 -- the MMDB edition, not their default .BIN. Prefer a
# country edition over a city one: only the country is ever decoded, so a city file puts
# lat/long and subdivisions on disk that this feature can never use.
#
# Empty is the default and a supported state: the feature reports itself unavailable, the
# analytics panel says so, and registration is unaffected. No database ships with the server --
# every vendor forbids redistribution, so the licence terms and the artefact are the operator's
# to take on.
#
# Setup, licensing and how to verify it took effect: docs/server/setup_guide.md section 8.11.
country_db_path: ""

# Who published the file at country_db_path. REQUIRED to turn the feature on: a path without
# this leaves geographic distribution off, and the panel says which of the two is missing.
#
# One of: maxmind | dbip | ip2location | ipinfo
#
# Declared rather than derived, because deriving it does not work (#1964). Measured against a
# real IP2LOCATION-LITE-DB11.MMDB: database_type "GeoLite2-City", description "GeoLite2City
# database", MaxMind's eight languages, and MaxMind's nested country.iso_code record schema.
# IP2Location ship a deliberate drop-in clone, so their file is indistinguishable from MaxMind's
# in every observable property -- and deriving the vendor credited MaxMind for IP2Location's
# data, leaving IP2Location's own required acknowledgment unshown.
#
# Each vendor's licence obliges a DIFFERENT visible credit, so a wrong guess is a licence breach
# rather than a cosmetic error. Naming it makes the operator the author of the claim. The gateway
# warns when this disagrees with the file's own metadata -- which catches a typo, but cannot tell
# which of the two is right and does not try.
#
# Also choosable from System Settings in the portal (#1995), where it is a DROPDOWN -- so a typo
# is impossible there rather than merely reported, and the screen shows the exact credit the
# chosen vendor will publish. PRECEDENCE: a vendor set in the portal WINS over this key, and the
# System Settings screen names whichever of the two is in force, so the two cannot disagree
# silently. Changing it needs no restart: the vendor never touches decoding, only the credit.
#
# country_db_path above deliberately stays YAML-only -- it is a path on this host, read at
# startup, and an admin session able to point the gateway at any readable file is a disclosure
# vector. The portal shows it read-only.
country_db_provider: ""

# Deprecated spelling of country_db_path, still honoured so no running deployment breaks
# (#1921). It named MaxMind in a setting that is really just "where the country database
# lives", and three vendors now work. If both are set, country_db_path wins and the gateway
# warns at startup -- so migrate the line rather than duplicating it.
geolite2_db_path: ""
