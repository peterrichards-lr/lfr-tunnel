version: '3.8'

services:
  # 1. Mock Liferay target instance
  mock-target:
    image: nginx:alpine
    volumes:
      - ./mock-html:/usr/share/nginx/html
    expose:
      - "80"

  # 2. Mailpit SMTP catcher
  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025" # Web UI / REST API
    expose:
      - "1025" # SMTP Port

  # 3. Control Plane Gateway
  lfr-tunneld-control:
    build:
      context: ../../
      dockerfile: cmd/lfr-tunneld/Dockerfile
    # The generated copy, not the committed one: run-edge.sh substitutes the schedule
    # placeholders with times a couple of minutes ahead so the shutdown-migration test has a
    # stop to react to (#1254). Run run-edge.sh rather than composing directly.
    command: ["--config", "/etc/lfr-tunneld/server-config-control.yaml"]
    volumes:
      - ./server-config-control.generated.yaml:/etc/lfr-tunneld/server-config-control.yaml:ro
      # Records what the control plane asked DNS to do instead of touching a provider, so the
      # harness can assert the record followed the tunnel between gateways (#1247).
      - ./dns-hook-fake.sh:/usr/local/bin/dns-hook.sh:ro
    expose:
      - "8080"
      - "8081"
    depends_on:
      - mailpit

  # 3b. Stateless Edge Node Gateway
  lfr-tunneld-edge:
    build:
      context: ../../
      dockerfile: cmd/lfr-tunneld/Dockerfile
    command: ["--config", "/etc/lfr-tunneld/server-config-edge.yaml"]
    volumes:
      - ./server-config-edge.yaml:/etc/lfr-tunneld/server-config-edge.yaml:ro
    # Published so the harness can address the edge directly with an apex Host header. Tunnels
    # are now issued at the apex (#1285) and this nginx sends *.lfr-demo.local to central, so
    # there is otherwise no way to reach an edge-held tunnel by the name its visitor uses.
    # That routing is #1247's job (a DNS hook pointing the host at the node holding it); until
    # it exists, hitting the node directly is what stands in for it.
    ports:
      - "8090:8090"
    expose:
      - "8090"
      - "8091"
    depends_on:
      - lfr-tunneld-control

  # 4. Nginx Reverse Proxy (VPS Mirror)
  nginx-proxy:
    image: nginx:alpine
    volumes:
      - ./nginx-edge.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8000:80"
    networks:
      default:
        aliases:
          - tunnel.lfr-demo.local
          - lfr-demo.local
          - us.lfr-demo.local
    depends_on:
      - lfr-tunneld-control
      - lfr-tunneld-edge

  # 5. Client CLI Container
  lfr-tunnel:
    build:
      context: ../../
      dockerfile: Dockerfile
    environment:
      - LFT_TARGET_HOST=mock-target
      - LFT_TARGET_PORT=80
    entrypoint: ["sleep", "infinity"]
    volumes:
      # /home/lfr, not /root: the client image runs as an unprivileged user with its WORKDIR
      # there (#1330). The test passes -config as a relative path, so the file has to land in
      # the working directory -- and /root would not be readable by that user in any case.
      - ./client-config-edge.yaml:/home/lfr/client-config-edge.yaml:ro
    depends_on:
      - nginx-proxy
