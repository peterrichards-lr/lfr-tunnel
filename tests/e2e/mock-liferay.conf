# A stand-in for Liferay for the preserve_host e2e step (#2571). Each server answers with the Host
# it received, so the step can see whether the client forwarded the PUBLIC host (preserve_host on)
# or rewrote it to the local one.
#
#   :80  sends Liferay-Portal, as DXP's MainServlet does on every response (measured on DXP
#        2026.q1/q3/q4, including redirects and 404s), so the client must identify it as Liferay.
#   :81  is the same server WITHOUT the header: the control. A client that turned preserve_host on
#        for every port, or never looked at the header, cannot pass both.
#
# The real portal was measured separately (docs/client_configuration.md, PR #2572); this fixture
# exists so the tunnel path itself is exercised on every CI run, which a 1 GB image booting for up
# to two minutes would not allow.
server {
    listen 80;
    location / {
        add_header Liferay-Portal "Liferay Digital Experience Platform" always;
        default_type text/plain;
        return 200 "host=$host\n";
    }
}

server {
    listen 81;
    location / {
        default_type text/plain;
        return 200 "host=$host\n";
    }
}
