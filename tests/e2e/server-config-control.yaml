domains:
  - "lfr-demo.local"
  - "us.lfr-demo.local"
  - "lfr-tunneld-control"
http_bind_addr: "0.0.0.0:8080"
db_path: "/etc/lfr-tunneld/lfr-tunnel.db"
smtp_server:
  host: "mailpit"
  port: 1025
  from_address: "Liferay Tunnel <noreply@lfr-demo.local>"

owner:
  user_id: "admin@lfr-demo.local"
  name: "Admin User"

admin_notification_email: "admin@lfr-demo.local"
owner_max_reservations: -1
allow_client_auto_reservation: true

sso_providers:
  - id: "keycloak"
    name: "Liferay Keycloak"
    client_id: "lfr-tunnel"
    client_secret: "secret"
    issuer_url: "http://keycloak:8080/realms/liferay"
    icon: "key"

prune_interval: 1m
magic_link_expiry: 1m
invite_link_expiry: 5m
verification_link_expiry: 5m
session_expiry: 5m
pat_retention_days: 30

docker_image: "peterjrichards/lfr-tunnel:latest"
docker_bypass_url: "https://github.com/peterrichards-lr/lfr-tunnel/blob/master/docs/liferay-se-guide.md#using-the-docker-wrapper-edr-bypass"
disable_client_downloads: true
disable_brew: true
disable_scoop: true
disable_api_rate_limit: true

# One minute rather than the five-minute default, so the migration test does not sit for
# five minutes waiting for a warning it already knows is coming (#1254).
# The harness serves plain HTTP behind nginx, so the default advertisement of
# "https://tunnel.<domain>" pointed clients at a port nothing listens on (#1286).
central_url: "http://tunnel.lfr-demo.local"

edge_shutdown_warning_minutes: 1

edge_nodes:
  - id: "edge-us"
    token_hash: "e0e4f2a8d0c91b8451be0437c1524cba76073de2b2a51c09add3ac637a210b21"
    # Without a url central never advertises this node as a region, so a client asking for
    # -region us was told "no active edge nodes found" and silently fell back to central --
    # which is not what a multi-region edge test is supposed to exercise (#1254).
    url: "http://us.lfr-demo.local"
    # Statically declared (#1282), because this environment has no edge-provisioner sidecar
    # to ask -- that is AWS-specific, and without a schedule from somewhere central would
    # never send a shutdown warning and the client would have nothing to react to.
    #
    # The times are placeholders. run-edge.sh substitutes them with a stop a couple of
    # minutes ahead and writes server-config-control.generated.yaml, which is what the
    # compose file actually mounts. Running docker-compose directly without run-edge.sh
    # will not find that file.
    schedule:
      enabled: true
      stop_time: "__E2E_STOP_TIME__"
      start_time: "__E2E_START_TIME__"
      timezone: "UTC"

client_platforms:
  macos_arm64:
    url: "http://lfr-demo.local:8080/static/downloads/lfr-tunnel-darwin-arm64"
    cmd: "curl -sSfL http://lfr-demo.local:8080/install.sh | sh"
    cmd_label: "🚀 Recommended Installation (EDR Whitelisted):"
    show_download: true
    download_label: "⬇️ Download Signed Binary"
    sha256: "6d4aef719dee798e611139e422d9231b226ec3538617d025fad08accf8fc63d6"
  macos_amd64:
    url: "http://lfr-demo.local:8080/static/downloads/lfr-tunnel-darwin-amd64"
    cmd: "curl -sSfL http://lfr-demo.local:8080/install.sh | sh"
    cmd_label: "🚀 Recommended Installation (EDR Whitelisted):"
    show_download: true
    download_label: "⬇️ Download Signed Binary"
    sha256: "6d4aef719dee798e611139e422d9231b226ec3538617d025fad08accf8fc63d6"
  windows_amd64:
    url: "http://lfr-demo.local:8080/static/downloads/lfr-tunnel-windows-amd64.exe"
    cmd: "irm http://lfr-demo.local:8080/install.ps1 | iex"
    cmd_label: "🚀 Recommended Installation (EDR Whitelisted):"
    show_download: true
    download_label: "⬇️ Download Signed Binary"
    sha256: "6d4aef719dee798e611139e422d9231b226ec3538617d025fad08accf8fc63d6"
  linux_amd64:
    url: "http://lfr-demo.local:8080/static/downloads/lfr-tunnel-linux-amd64"
    cmd: "curl -sSfL http://lfr-demo.local:8080/install.sh | sh"
    cmd_label: "🚀 Recommended Installation:"
    show_download: true
    download_label: "⬇️ Download Signed Binary"
    sha256: "6d4aef719dee798e611139e422d9231b226ec3538617d025fad08accf8fc63d6"
